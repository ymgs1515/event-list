<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>推活ログ</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;

            background: #eeeeee;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Hiragino Sans",
                "Yu Gothic UI",
                "Yu Gothic",
                Meiryo,
                sans-serif;
        }

        .offline {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .offline img {
            display: block;

            width: 96px;
            height: 96px;

            margin-bottom: 28px;

            border-radius: 20px;
        }

        .offline p {
            margin: 0;

            font-size: 16px;
            font-weight: 500;
        }
    </style>
</head>

<body>
    <div class="offline">
        <img src="/icons/icon-192.png" alt="推活ログ" width="96" height="96" />

        <p>オフラインです。</p>
    </div>
</body>

</html>
